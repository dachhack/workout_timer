name: Publish APK

# Every push to the default branch republishes the "latest" release, so the
# share link always serves the current build.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships an Android SDK; make sure it has what we target.
      - name: Ensure SDK pieces
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true

      - name: Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # A release signed with anything but the shared key cannot install over
      # the copies people already have, so refuse to publish one.
      - name: Restore the signing key
        if: env.IS_DEFAULT_BRANCH == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set. Publishing without it" \
                 "would produce an APK nobody can install over their current one." \
                 "See README > Signing for the one-time setup."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ env.IS_DEFAULT_BRANCH == 'true' && format('{0}/signing/release.keystore', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name it something a human would recognise
        run: |
          cp app/build/outputs/apk/release/app-release.apk f3-workout-timer.apk
          # A zip as well: some places refuse to carry a bare .apk.
          zip -q f3-workout-timer.zip f3-workout-timer.apk

      - name: Publish the release
        if: env.IS_DEFAULT_BRANCH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.versionName' update.json)
          BULLETS=$(jq -r '[.notes[] | "- " + .] | join("\n")' update.json)
          NOTES=$(printf '### What'"'"'s new\n\n%s\n\n**Install:** download `f3-workout-timer.apk` below and open it. Android will ask you to allow installing from this source. It installs straight over an older copy.\n\nIf your messaging app refuses to carry an APK, `f3-workout-timer.zip` holds the same file.\n' "$BULLETS")

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "F3 Workout Timer $VERSION" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create latest --title "F3 Workout Timer $VERSION" --notes "$NOTES" --target "$GITHUB_SHA"
          fi

          gh release upload latest f3-workout-timer.apk f3-workout-timer.zip --clobber

      - name: Keep the build for branches that do not publish
        if: env.IS_DEFAULT_BRANCH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: f3-workout-timer-apk
          path: f3-workout-timer.apk
